<!-- Correo de recuperación de contraseña. El enlace lleva a /restablecer con un
     código de un solo uso; el código se gasta hasta que la persona guarda su
     contraseña nueva, no al abrir el enlace. -->
<div style="font-family: Arial, Helvetica, sans-serif; color: #1c2333; max-width: 480px; margin: 0 auto;">
  <h2 style="font-size: 20px;">Restablece tu contraseña</h2>
  <p>Recibimos una solicitud para cambiar la contraseña de tu usuario del Sistema MOT.</p>
  <p>
    <a
      href="{{ .SiteURL }}/restablecer?token_hash={{ .TokenHash }}"
      style="display: inline-block; padding: 10px 18px; background: #2c4690; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: bold;"
    >Elegir contraseña nueva</a>
  </p>
  <p style="font-size: 13px; color: #5b6478;">
    El enlace sirve una sola vez y vence en una hora. Si tú no lo pediste, ignora
    este correo: tu contraseña no cambia.
  </p>
  <p style="font-size: 12px; color: #5b6478;">Molecular Oil Technology · Sistema MOT</p>
</div>
